<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main class="game">
        <h1>Tic Tac Toe</h1>
        <p class="status" role="status" aria-live="polite">X's turn</p>
        <div class="board" aria-label="Tic Tac Toe board">
            <button class="cell" type="button" aria-label="Top-left cell"></button>
            <button class="cell" type="button" aria-label="Top-center cell"></button>
            <button class="cell" type="button" aria-label="Top-right cell"></button>
            <button class="cell" type="button" aria-label="Middle-left cell"></button>
            <button class="cell" type="button" aria-label="Center cell"></button>
            <button class="cell" type="button" aria-label="Middle-right cell"></button>
            <button class="cell" type="button" aria-label="Bottom-left cell"></button>
            <button class="cell" type="button" aria-label="Bottom-center cell"></button>
            <button class="cell" type="button" aria-label="Bottom-right cell"></button>
        </div>
    </main>
    <script src="script.js"></script>
</body>

</html>
