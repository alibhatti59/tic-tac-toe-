name: CI

on:
  push:
  pull_request:

jobs:
  test-and-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check script syntax
        run: npm run check:script-syntax

      - name: Check win detection syntax
        run: npm run check:win-detection-syntax